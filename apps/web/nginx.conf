server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Allow an 8 MiB cosmetic concept image plus multipart overhead, and QA data URLs.
  client_max_body_size 9m;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /admin {
    return 308 $scheme://$http_host/admin/;
  }

  location /admin/ {
    proxy_pass http://admin-console:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location /api/ {
    proxy_pass http://game-api:8080;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /ws/chat {
    proxy_pass http://game-api:8080/ws/chat;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /actuator/ {
    return 404;
  }

  # 캐시 정책은 파일 이름에 내용 해시가 있는지로 가른다.
  #
  # - Vite 산출물은 dist/assets 바로 아래에 `이름-해시.확장자` 로 평탄화돼 나온다. 내용이 바뀌면
  #   이름도 바뀌므로 1년 immutable 로 둔다.
  # - public/ 에서 그대로 복사되는 자산(assets/chapters, assets/effects, cosmetics 등)은 해시가
  #   없다. immutable 을 주면 아트를 고쳐도 사용자에게 안 보이고, no-store 를 주면 방문마다 전부
  #   다시 받는다. 짧게 캐시한 뒤 ETag 로 재검증해 304 로 끝나게 한다. 즉시 바꿔야 하는 자산은
  #   지금처럼 `?v=` 로 주소를 바꾼다.
  location /assets/ {
    include /etc/nginx/auth/basic-auth.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";

    location ~ ^/assets/[^/]+$ {
      include /etc/nginx/auth/basic-auth.conf;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # 치장 레이어는 public/cosmetics 에 있어 `location /` 의 SPA 규칙을 타면 no-store 로 나가고
  # 없는 파일도 index.html 로 200 이 된다.
  location /cosmetics/ {
    include /etc/nginx/auth/basic-auth.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
  }

  location ~ ^/(favicon\.ico|og-image\.jpg|robots\.txt)$ {
    include /etc/nginx/auth/basic-auth.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    include /etc/nginx/auth/basic-auth.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }

  error_page 500 502 503 504 =502 /deployment.html;
  location = /deployment.html {
    internal;
    add_header Cache-Control "no-store" always;
  }
}
